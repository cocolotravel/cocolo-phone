<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>COCOLO Call</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <main class="card">
    <header>
      <h1>COCOLO Call</h1>
      <p class="muted">Calls from the COCOLO Paris number, recorded and added to the ticket as a note.</p>
    </header>

    <noscript><p class="error">This page needs JavaScript.</p></noscript>

    <!-- Step 1: sign in with the agents password -->
    <section id="login" hidden>
      <h2>Sign in</h2>
      <label for="user">Username</label>
      <input id="user" type="text" autocomplete="username">
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <button id="signin" type="button" class="primary">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </section>

    <!-- Step 2: check the customer and choose a number -->
    <section id="ticket" hidden>
      <div class="customer">
        <p class="muted" id="ticket-line"></p>
        <h2 id="customer-name"></h2>
        <p id="ticket-title" class="title"></p>
      </div>

      <fieldset id="numbers">
        <legend>Number to call</legend>
        <div id="phone-list"></div>
        <label for="manual">Or type a number (international format, for example +33 6 12 34 56 78)</label>
        <input id="manual" type="tel" placeholder="+33612345678" autocomplete="off">
        <p id="number-hint" class="hint" hidden></p>
      </fieldset>

      <label class="checkbox">
        <input id="norecord" type="checkbox">
        <span>Do not record this call (the customer has declined recording)</span>
      </label>

      <button id="call" type="button" class="primary">Call</button>
      <p id="status" class="status" aria-live="polite"></p>

      <div id="in-call" hidden>
        <p id="timer" class="timer">00:00</p>
        <div class="row">
          <button id="mute" type="button">Mute</button>
          <button id="hangup" type="button" class="danger">Hang up</button>
        </div>
      </div>
    </section>

    <p id="fatal" class="error" hidden></p>
  </main>

  <script src="vendor/twilio.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
